<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <meta name="apple-itunes-app" content="app-id=6768320289">
  <title>샴푸 · 공유 일정</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#fff4f6;color:#262133;font-family:system-ui,sans-serif;line-height:1.6;padding:32px 20px}
    main{max-width:460px;margin:8vh auto;background:#fff;border:1px solid #f3d7df;border-radius:28px;padding:28px}
    .brand{color:#b33160;font-weight:800;letter-spacing:.1em} h1{font-size:26px;margin:18px 0} p{color:#655d70}
    #details{white-space:pre-wrap;overflow-wrap:anywhere;border-radius:16px;background:#fff4f6;padding:18px}
    a{color:#a32f57} .button{display:block;border-radius:14px;padding:14px;text-align:center;background:#ac365f;color:white;text-decoration:none;font-weight:bold;margin:24px 0 12px}
    nav{display:flex;flex-wrap:wrap;gap:20px;margin-top:22px;font-size:14px} [hidden]{display:none!important}
  </style>
</head>
<body><main>
  <div class="brand">샴푸</div><h1>공유받은 일정</h1>
  <p id="details">일정 정보를 확인하고 있어요.</p>
  <a id="open" class="button" hidden>샴푸에서 일정 추가</a>
  <p id="help">앱에서 내용을 확인한 뒤 추가해주세요. 알림은 내 기본 설정을 사용합니다.</p>
  <nav><a href="https://apps.apple.com/app/id6768320289">아이폰 설치·업데이트</a><a href="https://play.google.com/store/apps/details?id=com.gameschedule.app">안드로이드 설치·업데이트</a></nav>
  <p><small>최신 샴푸 앱을 설치한 뒤 QR 링크를 다시 열어주세요.</small></p>
  <noscript>일정 정보를 보려면 브라우저의 JavaScript를 켜주세요.</noscript>
</main>
<script type="module">
import { parseSharedSchedule, encodeSharedSchedule } from '/schedule-share.js';
try {
  const schedule = parseSharedSchedule(location.href);
  const details = document.getElementById('details');
  details.textContent = `${schedule.gameName}\n${schedule.title}\n${schedule.startTime.slice(0,10)} · ${schedule.isAllDay ? '종일' : schedule.startTime.slice(11,16)}`;
  const open = document.getElementById('open');
  open.href = 'game-schedule://schedule/create?share=' + encodeURIComponent(encodeSharedSchedule(schedule));
  open.hidden = false;
} catch {
  document.getElementById('details').textContent = '일정 링크가 없거나 올바르지 않아요.';
  document.getElementById('help').textContent = '공유한 사람에게 새 QR 이미지를 요청해주세요.';
}
</script></body></html>
